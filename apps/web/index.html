<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser/OS chrome around the app. TWO tags, because a single one is a
         single colour: on a dark-mode phone the address bar and the task-switcher
         card were cream while the reader was candlelit. A UA uses the FIRST
         theme-color whose media matches, so the pair below resolves to exactly
         one value before any script runs.

         Both hexes are `paper` from crates/core/src/theme.rs — Theme::Light and
         Theme::Dark. Dark and not Night because that is what ThemeChoice::System
         resolves a dark device to; Night (#000000) is only ever chosen by hand.
         The light value moved in the WCAG pass (2026-07-29) — paper did not, but
         if it ever does, `e2e/manifest.spec.ts` fails rather than letting the
         chrome drift a shade off the page it frames. -->
    <meta name="theme-color" content="#fcf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1b16" media="(prefers-color-scheme: dark)" />
    <title>Plumbline Bible</title>
    <meta
      name="description"
      content="The Holy Bible, free and offline — the whole 1769 King James Version on your own device. No account, no sign-in, nothing phoned home."
    />

    <!-- The link card: what a stranger sees when someone pastes this address into
         a chat, a bulletin, or a post. It is the app's first sentence, so it says
         what Plumbline IS rather than what it has.

         ABSOLUTE urls on purpose. Everything else here is relative — `base: "./"`
         keeps the bundle host-agnostic — but a crawler is not a browser: it reads
         the markup, resolves nothing, and drops a card whose image it cannot
         fetch. So these name the one origin the app is shared from. (The old Pages
         address 301s there, and a 301 is followed.)

         og:image states its exact pixel size because scrapers that would have to
         download and measure the file often skip the image instead — which means
         the numbers below and the shipped PNG can disagree with nothing on screen
         to show it. `e2e/social.spec.ts` decodes the file and holds them equal. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plumbline" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://plumblinebible.org/" />
    <meta property="og:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      property="og:description"
      content="The Holy Bible, free and offline — the whole 1769 King James Version on your own device. No account, no sign-in, nothing phoned home."
    />
    <meta property="og:image" content="https://plumblinebible.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Plumbline mark — a woven gold cross on warm paper — beside the word Plumbline and the line “The Holy Bible, free and offline.”"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      name="twitter:description"
      content="The Holy Bible, free and offline — the whole 1769 King James Version on your own device. No account, no sign-in, nothing phoned home."
    />
    <meta name="twitter:image" content="https://plumblinebible.org/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Plumbline mark — a woven gold cross on warm paper — beside the word Plumbline and the line “The Holy Bible, free and offline.”"
    />

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the webmanifest icons when someone adds this to their home
         screen, and it composites a transparent icon on BLACK, so this one is
         opaque and bleeds to all four edges — iOS rounds the corners itself.
         Without it the home screen shows a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./fonts.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- What a browser with JavaScript switched off gets, and what a text-only
         crawler reads. Both used to get blank cream paper for ever, which reads
         as a broken site rather than an unmet requirement. There is nothing to
         degrade to: the text, the concordance and the reader's own notes are all
         built in the page from a local engine, with no server rendering anything.

         The styles live INSIDE the noscript on purpose. A browser with scripting
         ENABLED never parses the contents of a noscript element — they are raw
         text to it — so nothing in here can reach the running app: not the CSS,
         not the markup, not the accessibility tree, not Ctrl+F. And it cannot
         lean on the bundle's stylesheet either, because the premise is that the
         bundle never ran. Same palette values as the light/dark themes. -->
    <noscript>
      <style>
        #app {
          display: none;
        }
        :root {
          color-scheme: light dark;
          --ns-paper: #fcf9f4;
          --ns-ink: #211f1a;
          --ns-faded: #6c665d;
          --ns-gold: #7d632c;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --ns-paper: #1f1b16;
            --ns-ink: #e8e0d0;
            --ns-faded: #9a9385;
            --ns-gold: #c8a24e;
          }
        }
        body {
          margin: 0;
          background: var(--ns-paper);
          color: var(--ns-ink);
          font-family: "EB Garamond", Georgia, "Times New Roman", serif;
          line-height: 1.6;
        }
        .noscript-page {
          box-sizing: border-box;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1.5rem;
        }
        .noscript-card {
          max-width: 30rem;
        }
        .noscript-card h1 {
          margin: 0 0 0.15rem;
          font-size: 2rem;
          font-weight: 600;
          letter-spacing: 0.02em;
        }
        .noscript-card p {
          margin: 0.9rem 0 0;
        }
        .noscript-card .tagline {
          margin: 0;
          color: var(--ns-faded);
          font-size: 1.1rem;
        }
        .noscript-card .aside {
          margin-top: 1.4rem;
          color: var(--ns-faded);
          font-size: 0.95rem;
        }
        .noscript-card a {
          color: var(--ns-gold);
        }
      </style>
      <div class="noscript-page">
        <div class="noscript-card">
          <h1>Plumbline</h1>
          <p class="tagline">
            The Holy Bible, free and offline — the whole 1769 King James Version, on your own
            device.
          </p>
          <p>
            Plumbline needs JavaScript. The text, the concordance and your own notes all run here
            on your device rather than on a server, so there is no plain page to fall back to.
            Switch JavaScript on for this site and reload: the Bible downloads once, and after that
            it opens with the network off.
          </p>
          <p class="aside">
            If you would rather not run it, there is an Android app on the
            <a href="https://github.com/glendonjklassen/plumbline/releases">Releases page</a>.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
