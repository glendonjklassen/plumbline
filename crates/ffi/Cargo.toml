[package]
name = "plumbline-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Plumbline's C ABI surface: consumed by JNA (Kotlin/Android) and, compiled to wasm, by the web shell."

[lib]
# A C-callable dynamic + static lib. `cdylib` for Android/.so and Windows/.dll;
# `staticlib` if a UI wants to link it in directly. `lib` keeps it usable as a
# normal Rust dependency (and lets the `plumbline-bindgen` bin reason over its API).
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
plumbline-core = { workspace = true }
plumbline-layout = { workspace = true }
# The R&D tier (etymology/fused bridge, concept embeddings, morphology) so the
# native shells reach it over the one ABI. Pure Rust — no system deps — so the
# cdylib still cross-builds for Windows/Android.
plumbline-rnd = { workspace = true, features = ["bridge", "embeddings", "morphology", "concept"] }
serde = { workspace = true }
serde_json = { workspace = true }

# Binding generators run only for the `plumbline-bindgen` helper (feature-gated) so a
# plain `cargo build` / cross-build of the cdylib never pulls host-only tools.
[dependencies.cbindgen]
version = "0.29"
optional = true

[features]
# `cargo run -p plumbline-ffi --features bindgen --bin plumbline-bindgen` regenerates the
# committed C header from this crate's `extern "C"` surface (and checks the
# hand-written Kotlin binding against it).
bindgen = ["dep:cbindgen"]

[[bin]]
name = "plumbline-bindgen"
required-features = ["bindgen"]
