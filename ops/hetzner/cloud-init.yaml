  - path: /etc/sysctl.d/99-hardening.conf
    content: |
      net.ipv4.conf.all.rp_filter = 1
      net.ipv4.conf.default.rp_filter = 1
      net.ipv4.conf.all.accept_redirects = 0
      net.ipv6.conf.all.accept_redirects = 0
      net.ipv4.conf.all.send_redirects = 0
      net.ipv4.conf.all.accept_source_route = 0
      net.ipv6.conf.all.accept_source_route = 0
      net.ipv4.tcp_syncookies = 1
      kernel.kptr_restrict = 2
      kernel.dmesg_restrict = 1
  # Sandbox Caddy: read-only system except its certificate store, no new
  # privileges, service syscalls only. A drop-in, so package upgrades keep it;
  # EPERM rather than a kill if a future Caddy reaches past the filter.
  - path: /etc/systemd/system/caddy.service.d/hardening.conf
    content: |
      [Service]
      NoNewPrivileges=true
      ProtectSystem=strict
      ReadWritePaths=/var/lib/caddy
      ProtectHome=true
      PrivateTmp=true
      PrivateDevices=true
      ProtectKernelTunables=true
      ProtectKernelModules=true
      ProtectKernelLogs=true
      ProtectControlGroups=true
      ProtectClock=true
      ProtectHostname=true
      RestrictNamespaces=true
      RestrictRealtime=true
      RestrictSUIDSGID=true
      LockPersonality=true
      MemoryDenyWriteExecute=true
      RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_NET_ADMIN
      SystemCallArchitectures=native
      SystemCallFilter=@system-service
      SystemCallErrorNumber=EPERM
  - path: /etc/caddy/Caddyfile
    # After the caddy package, so its stock Caddyfile cannot win.
    defer: true
    content: |
      # Plain HTTP until there is a hostname: replace `:80` with it, point DNS
      # here, `systemctl reload caddy`, and Caddy fetches the certificate itself.
      # The live boxes: `plumblinebible.org, www.plumblinebible.org,
      # plumblinebible.ch, www.plumblinebible.ch {`.
      #
      # Two boxes answer for the names, each with its own certificate, and a
      # certificate challenge reaches whichever box DNS hands out. Caddy answers
      # its own challenge tokens on port 80 before any route; this block forwards
      # the tokens it does not know to the other box, which does. Replace
      # `<other box IPv4>` (README, "Two boxes"). Everything else on port 80 is
      # redirected, which is what Caddy would have done on its own had this
      # block not claimed the port for these names.
      http://plumblinebible.org, http://www.plumblinebible.org, http://plumblinebible.ch, http://www.plumblinebible.ch {
          handle /.well-known/acme-challenge/* {
              reverse_proxy <other box IPv4>:80
          }
          redir https://{host}{uri} 308
      }

      # On every response, the 404 page included: handle_errors is a second
      # handler chain, so a `header` in the site block alone left the error
      # page bare (seen live, 2026-10-22). check-site.sh holds what the box
      # serves to this block, on / and on a 404, so an edit made on the box by
      # hand and not here fails the daily check.
      (security) {
          header {
              X-Content-Type-Options nosniff
              Referrer-Policy strict-origin-when-cross-origin
              Permissions-Policy "camera=(), microphone=(), geolocation=()"
              # A year, www included; the site has only ever answered plain
              # HTTP with a redirect. No `preload`: that list is one-way.
              Strict-Transport-Security "max-age=31536000; includeSubDomains"
              # What the page may load, and from where: everything is its own
              # origin, the engine worker and the service worker included, and
              # the worker needs 'wasm-unsafe-eval' to instantiate the engine.
              # The two sha256s are the only inline code: index.html's theme
              # script and 404.html's redirect. apps/web/e2e/csp.spec.ts
              # re-derives both from the build, and `vite preview` serves this exact value (read
              # out of this file by vite.config.ts), so the whole Playwright
              # suite runs under it. 'unsafe-inline' for styles only, because
              # Svelte sets style attributes and no hash can allow those.
              Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-vsnIEdpkWvc7k7xpwZUTXrKhTiZ5Z5Rq7pRqznCi7vQ=' 'sha256-Kc/Y37SDOEpCuxYePP5/9M81Qv039zsTRntxdCV2vJw='; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
              -Server
          }
      }

      :80 {
          root * /srv/plumbline
          encode zstd gzip
          import security
          # Everything under /pack/ is content-addressed (?h=<hash>): cache for a
          # year — except the pack manifest, the one file there whose URL carries
          # no hash. Until v0.81.1 it was covered too, and every installed device
          # kept the manifest of the release it first saw: the app updated and the
          # data never did. check-site.sh fails on a box that still serves it so.
          @pack {
              path /pack/*
              not path /pack/manifest.json
          }
          header @pack Cache-Control "public, max-age=31536000, immutable"
          # The shell, the worker and the pack manifest must always revalidate,
          # or an update never lands.
          @shell path / /sw.js /index.html /shell-manifest.json /manifest.webmanifest /pack/manifest.json
          header @shell Cache-Control "no-cache"
          handle_errors {
              import security
              @404 expression {http.error.status_code} == 404
              rewrite @404 /404.html
              file_server
          }
          file_server
      }

runcmd:
  - [sysctl, --system]
  - [ufw, default, deny, incoming]
  - [ufw, default, allow, outgoing]
  - [ufw, allow, "22/tcp"]
  - [ufw, allow, "80/tcp"]
  - [ufw, allow, "443/tcp"]
  - [ufw, --force, enable]
  - [mkdir, -p, /srv/plumbline]
  - [chown, -R, "release:release", /srv/plumbline]
  - [systemctl, enable, --now, fail2ban]
  - [systemctl, enable, --now, caddy]
  - [systemctl, restart, ssh]
  - [passwd, -l, root]
