[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/layout",
    "crates/rnd",
    "crates/ffi",
    "crates/hydrate",
]

default-members = [
    "crates/core",
    "crates/layout",
    "crates/rnd",
    "crates/ffi",
    "crates/hydrate",
]

[workspace.package]
# The version every crate inherits, and the one `plumbline_version()` hands the
# shells — About renders it as `engine ` + this number. The workflow refuses a tag
# whose version disagrees with this line (and with apps/web/package.json), so a
# release ships one number, not three.
version = "0.60.0"
edition = "2021"
license = "MIT"
authors = ["Glendon Klassen <gjklassen@proton.me>"]
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Compact binary codec + gzip for the startup corpus cache (skips re-parsing
# 19 MB of JSONL when the source is unchanged, and keeps the cache file small).
bincode = "1"
flate2 = "1"

# Internal crates
plumbline-core = { path = "crates/core" }
plumbline-layout = { path = "crates/layout" }
plumbline-rnd = { path = "crates/rnd" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
# Do NOT add `panic = "abort"`: the C ABI's safety story depends on
# `catch_unwind` firewalls in crates/ffi (a panic must never unwind across
# the FFI boundary, but it must be *catchable*).
