name: Release

# Tag a version (v0.2.0) and this turns the repo into a download page:
# self-contained Windows apps for arm64 / x64 / x86, each bundling the data
# pack, plus a signed Android APK (arm64-v8a + x86_64), attached to a GitHub
# Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc,x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Package all architectures
        run: pwsh scripts/package-windows.ps1 -Arch arm64,x64,x86 -Version "${{ github.ref_name }}"
      - name: Attach engine DLLs for developers
        run: |
          copy target\aarch64-pc-windows-msvc\release\pure_ffi.dll dist\pure_ffi-${{ github.ref_name }}-arm64.dll
          copy target\x86_64-pc-windows-msvc\release\pure_ffi.dll dist\pure_ffi-${{ github.ref_name }}-x64.dll
          copy target\i686-pc-windows-msvc\release\pure_ffi.dll dist\pure_ffi-${{ github.ref_name }}-x86.dll
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --title "pure study ${{ github.ref_name }}" --generate-notes

  # Cross-compiles the Rust core for Android, builds a signed release APK
  # (arm64-v8a for the device + x86_64 for emulators), and attaches it to the
  # release the Windows job created. Requires four repo secrets (Settings →
  # Secrets and variables → Actions); without them the job no-ops with a warning
  # so the Windows release still ships:
  #   ANDROID_KEYSTORE_BASE64    base64 of your release keystore (.jks)
  #   ANDROID_KEYSTORE_PASSWORD  store password
  #   ANDROID_KEY_ALIAS          key alias
  #   ANDROID_KEY_PASSWORD       key password
  # Generate the keystore once (keep it + the passwords safe — this key identifies
  # every future update; losing it means users must uninstall to upgrade):
  #   keytool -genkeypair -v -keystore pure-study.jks -alias pure-study \
  #       -keyalg RSA -keysize 4096 -validity 10000
  #   base64 -w0 pure-study.jks    # → paste into ANDROID_KEYSTORE_BASE64
  android:
    runs-on: ubuntu-latest
    needs: windows
    steps:
      - uses: actions/checkout@v4

      - name: Signing secrets present?
        id: sign
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ANDROID_KEYSTORE_* secrets not set — skipping the Android APK. Add them to attach a signed APK to releases."
          fi

      - uses: actions/setup-java@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        if: steps.sign.outputs.ready == 'true'

      - name: Install SDK platform + build-tools
        if: steps.sign.outputs.ready == 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools" >/dev/null

      - uses: dtolnay/rust-toolchain@stable
        if: steps.sign.outputs.ready == 'true'
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        if: steps.sign.outputs.ready == 'true'

      - name: Install cargo-ndk
        if: steps.sign.outputs.ready == 'true'
        run: cargo install cargo-ndk --locked

      - name: Cross-compile libpure_ffi.so (arm64-v8a + x86_64, 16 KB-aligned)
        if: steps.sign.outputs.ready == 'true'
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          cargo ndk -t arm64-v8a -t x86_64 --platform 26 \
            -o apps/android/app/src/main/jniLibs build -p pure-ffi --release

      - name: Build the signed release APK
        if: steps.sign.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$ANDROID_KEYSTORE_FILE"
          chmod +x apps/android/gradlew
          apps/android/gradlew -p apps/android :app:assembleRelease --console=plain

      - name: Attach the APK to the release
        if: steps.sign.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="pure-study-${{ github.ref_name }}-android.apk"
          cp apps/android/app/build/outputs/apk/release/app-release.apk "$OUT"
          gh release upload "${{ github.ref_name }}" "$OUT" --clobber
