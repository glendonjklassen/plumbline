[package]
name = "pure-rnd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Optional, feature-gated R&D layer for pure-study: embeddings, morphology, keyness, trust."

[dependencies]
pure-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# Each R&D capability is its own feature so a simple-reader build compiles none
# of them. `full` turns everything on. The UI reads which are enabled and hides
# the rest (decision #4: off + guided first-run).
default = []
# The OT↔NT etymology bridge: pure, derived from data already in the repo
# (Strong's own derivation strings) — no ML, no external packs. It is the
# primitive the concept engine follows across the testaments.
bridge = []
embeddings = []
morphology = []
keyness = []
trust = []
# The symbolic concept engine: co-occurrence statistics + community graph, pure
# corpus folds (no ML data).
concept = []
full = ["bridge", "embeddings", "morphology", "keyness", "trust", "concept"]
