<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser/OS chrome around the app. TWO tags, because one tag is one
         colour and a dark-mode phone would frame a candlelit reader in cream. A
         UA uses the first theme-color whose media matches, so the pair resolves
         to one value before any script runs.

         Both hexes are `paper` from crates/core/src/theme.rs (Theme::Light and
         Theme::Dark — Dark, not Night, because that is what ThemeChoice::System
         resolves a dark device to). `e2e/manifest.spec.ts` re-derives them from
         that file, so the chrome cannot drift a shade off the page it frames. -->
    <meta name="theme-color" content="#fcf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1b16" media="(prefers-color-scheme: dark)" />
    <title>Plumbline Bible</title>
    <meta
      name="description"
      content="The Holy Bible in a free, private, offline application."
    />

    <!-- The link card: what a stranger sees when this address is pasted into a
         chat or a post.

         ABSOLUTE urls on purpose, where everything else here is relative
         (`base: "./"` keeps the bundle host-agnostic): a crawler reads the
         markup, resolves nothing, and drops a card whose image it cannot fetch.

         og:image states its exact pixel size, because a scraper that would have
         to download and measure the file often skips the image instead — so the
         numbers and the shipped PNG can disagree with nothing on screen to show
         it. `e2e/social.spec.ts` decodes the file and holds them equal. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plumbline" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://plumblinebible.org/" />
    <meta property="og:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      property="og:description"
      content="The Holy Bible in a free, private, offline application."
    />
    <meta property="og:image" content="https://plumblinebible.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Plumbline icon, a cross."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      name="twitter:description"
      content="The Holy Bible in a free, private, offline application."
    />
    <meta name="twitter:image" content="https://plumblinebible.org/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Plumbline icon, a cross."
    />

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the webmanifest icons when someone adds this to their home
         screen, and it composites a transparent icon on BLACK, so this one is
         opaque and bleeds to all four edges — iOS rounds the corners itself.
         Without it the home screen shows a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./fonts.css" />

    <!-- The page's colours before any of the app exists, so a dark-theme reader
         gets no full-screen cream flash on launch. Two layers, cheapest first:
           1. these defaults, so a first-ever visit with nothing stored opens in
              the scheme the device asked for;
           2. the inline script, which overrides them with last session's actual
              resolved palette (a reader on Night, or on a theme that disagrees
              with the OS, is not served by a media query).
         `applyTheme()` overwrites both the moment the engine answers, so neither
         can be wrong for longer than the splash.

         Only the roles the splash and the bare page paint: paper, ink, faded,
         gold, rule, and tierResearch (the alarm colour the boot error is written
         in — and a boot error is exactly when nothing has been stored yet).
         Values are Theme::Light / Theme::Dark from crates/core/src/theme.rs, and
         `e2e/splash.spec.ts` re-derives each from that file. -->
    <style>
      :root {
        /* The controls the BROWSER draws — scrollbars, the time input's glyphs,
           native picker popups. Unset, a UA assumes light and paints them
           near-black on a dark theme's surfaces. `session.applyTheme()`
           overwrites this; the media pair holds until it runs. */
        color-scheme: light;
        --paper: #fcf9f4;
        --ink: #211f1a;
        --faded: #6c665d;
        --gold: #7d632c;
        --rule: #d8cba8;
        --tierResearch: #aa4838;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #1f1b16;
          --ink: #f5f1e8;
          --faded: #9a9385;
          --gold: #c8a24e;
          --rule: #4a4234;
          --tierResearch: #d17261;
        }
      }
    </style>
    <!-- A classic, blocking, inline script ON PURPOSE: it has to run before the
         first paint, and a module script (or one in the bundle) is deferred
         until after layout — which is the flash it exists to remove. Same reason
         it is not in App.svelte: Svelte mounts long after the first paint. -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem("plumbline:palette") || "null");
        var choice = localStorage.getItem("plumbline:themeChoice");
        var explicit = !!choice && choice !== "system";
        // Is last session's palette still the right answer? For a theme chosen
        // by hand, always. For "follow the device", only while the device is
        // still in the scheme it was in — a phone that went dark overnight would
        // otherwise be repainted light from the cache, an inline var overriding
        // the media-scoped defaults above, which cannot be wrong.
        var useVars =
          !!stored &&
          (explicit || !!stored.dark === matchMedia("(prefers-color-scheme: dark)").matches);
        // Every string role, not a hand-picked few: `applyTheme()` sets one
        // custom property per string field, and a subset here would be a second
        // list to keep in step.
        if (useVars) {
          for (var role in stored)
            if (typeof stored[role] === "string")
              document.documentElement.style.setProperty("--" + role, stored[role]);
          // The status bar too, and BOTH tags (see session.applyTheme) — but
          // only for a theme chosen by hand. For "follow the device" the
          // media-scoped pair above is already right and last session's paper
          // may not be; for an explicit theme the cached paper is right whatever
          // the device says, and the pair is what is stale.
          //
          // `paper`, not `paneNavBg`: this is the SPLASH's chrome, and the
          // splash paints paper edge to edge, so `Session.chrome` hands over to
          // `paneNavBg` once the palette lands. The handoff cannot flip an icon
          // — the two have the same polarity in every palette.
          if (typeof stored.paper === "string" && explicit) {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", stored.paper);
            // The UA-drawn controls, on the same terms: the media pair above
            // answers for "follow the device", last session's flag for a theme
            // chosen by hand (Night on a light-mode phone is not served by the
            // query).
            document.documentElement.style.colorScheme = stored.dark ? "dark" : "light";
          }
        }
      } catch (e) {
        /* storage blocked or unparseable: the defaults above still paint */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- What a browser with JavaScript off gets, and what a text-only crawler
         reads: otherwise blank cream paper, which reads as a broken site rather
         than an unmet requirement. There is nothing to degrade to — the text,
         the concordance and the reader's notes are all built in the page.

         The styles live INSIDE the noscript on purpose. A browser with scripting
         enabled never parses a noscript element's contents — they are raw text
         to it — so nothing in here reaches the running app: not the CSS, not the
         markup, not the accessibility tree, not Ctrl+F. It cannot lean on the
         bundle's stylesheet either, since the premise is that the bundle never
         ran. Same palette values as the light/dark themes. -->
    <noscript>
      <style>
        #app {
          display: none;
        }
        :root {
          color-scheme: light dark;
          --ns-paper: #fcf9f4;
          --ns-ink: #211f1a;
          --ns-faded: #6c665d;
          --ns-gold: #7d632c;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --ns-paper: #1f1b16;
            --ns-ink: #f5f1e8;
            --ns-faded: #9a9385;
            --ns-gold: #c8a24e;
          }
        }
        body {
          margin: 0;
          background: var(--ns-paper);
          color: var(--ns-ink);
          font-family: "EB Garamond", Georgia, "Times New Roman", serif;
          line-height: 1.6;
        }
        .noscript-page {
          box-sizing: border-box;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1.5rem;
        }
        .noscript-card {
          max-width: 30rem;
        }
        .noscript-card h1 {
          margin: 0 0 0.15rem;
          font-size: 2rem;
          font-weight: 600;
          letter-spacing: 0.02em;
        }
        .noscript-card p {
          margin: 0.9rem 0 0;
        }
        .noscript-card .tagline {
          margin: 0;
          color: var(--ns-faded);
          font-size: 1.1rem;
        }
        .noscript-card .aside {
          margin-top: 1.4rem;
          color: var(--ns-faded);
          font-size: 0.95rem;
        }
        .noscript-card a {
          color: var(--ns-gold);
        }
      </style>
      <div class="noscript-page">
        <div class="noscript-card">
          <h1>Plumbline</h1>
          <p class="tagline">
            The Holy Bible, free and offline — the whole 1769 King James Version, on your own
            device.
          </p>
          <p>
            Plumbline needs JavaScript. The text, the concordance and your own notes all run here
            on your device rather than on a server, so there is no plain page to fall back to.
            Switch JavaScript on for this site and reload: the Bible downloads once, and after that
            it opens with the network off.
          </p>
          <p class="aside">
            If you would rather not run it, there is an Android app on the
            <a href="https://github.com/glendonjklassen/plumbline/releases">Releases page</a>.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
