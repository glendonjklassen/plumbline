<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Plumbline">
  <!-- warm paper tile -->
  <rect x="1" y="1" width="254" height="254" rx="48" ry="48" fill="#fcf9f4"/>
  <rect x="1" y="1" width="254" height="254" rx="48" ry="48" fill="none"
        stroke="#9e7d38" stroke-opacity="0.25" stroke-width="2"/>

  <!-- woven Latin cross: two vertical + two horizontal gold strands -->
  <g fill="#9e7d38" stroke="#856a2e" stroke-width="1.1">
    <rect x="106" y="44" width="17" height="168" rx="8" ry="8"/>
    <rect x="133" y="44" width="17" height="168" rx="8" ry="8"/>
    <rect x="60"  y="74" width="136" height="17" rx="8" ry="8"/>
    <rect x="60"  y="101" width="136" height="17" rx="8" ry="8"/>
  </g>

  <!-- soft weave shadow: darker gold on the UNDER strand just past each tuck -->
  <g fill="#856a2e" fill-opacity="0.39">
    <rect x="100" y="74" width="3" height="17"/>
    <rect x="126" y="74" width="3" height="17"/>
    <rect x="133" y="68" width="17" height="3"/>
    <rect x="133" y="94" width="17" height="3"/>
    <rect x="106" y="95" width="17" height="3"/>
    <rect x="106" y="121" width="17" height="3"/>
    <rect x="127" y="101" width="3" height="17"/>
    <rect x="153" y="101" width="3" height="17"/>
  </g>

  <!-- basket-weave tuck gaps (paper) carve the UNDER strand at each crossing -->
  <g fill="#fcf9f4">
    <!-- TL: vertical over horizontal -->
    <rect x="103" y="74" width="3" height="17"/>
    <rect x="123" y="74" width="3" height="17"/>
    <!-- TR: horizontal over vertical -->
    <rect x="133" y="71" width="17" height="3"/>
    <rect x="133" y="91" width="17" height="3"/>
    <!-- BL: horizontal over vertical -->
    <rect x="106" y="98" width="17" height="3"/>
    <rect x="106" y="118" width="17" height="3"/>
    <!-- BR: vertical over horizontal -->
    <rect x="130" y="101" width="3" height="17"/>
    <rect x="150" y="101" width="3" height="17"/>
  </g>
</svg>
