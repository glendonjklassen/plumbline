#cloud-config
# Plumbline mirror — Hetzner Cloud, Debian 13. Paste into "Cloud config" when
# creating the server (ops/hetzner/README.md walks through it). Serves plain
# HTTP until a hostname replaces `:80`. If the package's stock Caddyfile wins
# the race on first boot, `systemctl reload caddy` once the deferred write has
# landed, or re-paste the block below.
#
# What it does: a `deploy` user with your SSH key; root login and
# passwords off; ufw (22/80/443) and fail2ban on; unattended security updates
# with a reboot window; Caddy serving /srv/plumbline with automatic HTTPS,
# installed from Caddy's own apt repository so unattended upgrades keep it
# current (Debian's package stays on the release's version).

hostname: plumbline-mirror
timezone: UTC

users:
  # The maintainer: sudo, for the box's upkeep. Only the maintainer's own key
  # lands here (ops/hetzner/README.md); replace it when rebuilding for someone
  # else.
  - name: deploy
    groups: [sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    lock_passwd: true
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGszTS8ZuSO9aAHnH46ZVxW9Wk2Tks7V+6D0R2f1LdeS plumbline mirror
  # The release workflow's user: owns the web root, has no sudo, and admits one
  # key bound to one command — an rsync INTO /srv/plumbline. `restrict` is no
  # forwarding, no pty, no X11; rrsync (shipped by the rsync package) refuses
  # everything that is not an rsync server rooted there and `-wo` refuses to
  # send anything back. A leaked key, or a bug in the rsync receiver, can
  # overwrite the public site and nothing else: there is no sudo on this account
  # to reach past it. Every path the client names is read relative to that root,
  # which is why release.yml targets `:/`. The shell is a real one because sshd
  # runs a forced command through it; the key's restriction is what stops a
  # login, not the shell.
  - name: release
    shell: /bin/sh
    lock_passwd: true
    ssh_authorized_keys:
      - restrict,command="/usr/bin/rrsync -wo /srv/plumbline" CI_DEPLOY_PUBLIC_KEY

package_update: true
package_upgrade: true
packages: [caddy, ufw, fail2ban, unattended-upgrades, rsync]

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      AllowAgentForwarding no
      AllowTcpForwarding no
      MaxAuthTries 3
      LoginGraceTime 20
      ClientAliveInterval 300
      ClientAliveCountMax 2
      AllowUsers deploy release
  - path: /etc/fail2ban/jail.local
    content: |
      [DEFAULT]
      bantime = 1h
      findtime = 10m
      maxretry = 5
      backend = systemd
      [sshd]
      enabled = true
  - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:30";
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      // Caddy's repository, alongside Debian's own origins.
      Unattended-Upgrade::Origins-Pattern { "origin=cloudsmith/caddy/stable"; };
      // Keep the edited /etc/caddy/Caddyfile; without this a new default
      // Caddyfile makes unattended-upgrades hold Caddy back.
      Dpkg::Options { "--force-confdef"; "--force-confold"; };
  # Caddy's apt repository. The key is pinned here rather than fetched at boot;
  # fingerprint 6576 0C51 EDEA 2017 CEA2  CA15 155B 6D79 CA56 EA34.
  - path: /etc/apt/sources.list.d/caddy-stable.list
    content: |
      deb [signed-by=/etc/apt/keyrings/caddy-stable.asc] https://dl.cloudsmith.io/public/caddy/stable/deb/debian any-version main
  - path: /etc/apt/keyrings/caddy-stable.asc
