[package]
name = "pure-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "GTK4 + libadwaita desktop shell for pure-study (Linux; the first native UI)."

[[bin]]
name = "pure-study"
path = "src/main.rs"

[dependencies]
# libadwaita 0.9 targets gtk4 0.11 (they share the gtk4-sys `links` slot);
# keep these paired. Version features target the crate API level (≤ our
# system GTK 4.22 / libadwaita 1.9).
gtk = { version = "0.11", package = "gtk4", features = ["v4_10"] }
adw = { version = "0.9", package = "libadwaita", features = ["v1_4"] }
# Real text: Pango shaping rendered onto the cairo canvas (replaces cairo's toy
# font API). `pango`/`cairo` come in via gtk4, but pango↔cairo glue is its own
# crate. Pinned to the same gtk-rs generation as gdk4 0.11 (pango 0.22).
pango = "0.22"
pangocairo = "0.22"
# Register the bundled EB Garamond with fontconfig at startup (no system install).
fontconfig-sys = { package = "yeslogic-fontconfig-sys", version = "6" }
pure-core = { workspace = true }
pure-layout = { workspace = true }
# The desktop is the full study shell; it compiles the pure, ML-free R&D
# capabilities (the OT↔NT etymology bridge) and surfaces them only in Full
# study mode (decision #4).
pure-rnd = { workspace = true, features = ["bridge", "embeddings"] }
