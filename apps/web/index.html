<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- The browser/OS chrome around the app. TWO tags, because a single one is a
         single colour: on a dark-mode phone the address bar and the task-switcher
         card were cream while the reader was candlelit. A UA uses the FIRST
         theme-color whose media matches, so the pair below resolves to exactly
         one value before any script runs.

         Both hexes are `paper` from crates/core/src/theme.rs — Theme::Light and
         Theme::Dark. Dark and not Night because that is what ThemeChoice::System
         resolves a dark device to; Night (#000000) is only ever chosen by hand.
         The light value moved in the WCAG pass (2026-07-29) — paper did not, but
         if it ever does, `e2e/manifest.spec.ts` fails rather than letting the
         chrome drift a shade off the page it frames. -->
    <meta name="theme-color" content="#fcf9f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1f1b16" media="(prefers-color-scheme: dark)" />
    <title>Plumbline Bible</title>
    <meta
      name="description"
      content="The Holy Bible in a free, private, offline application."
    />

    <!-- The link card: what a stranger sees when someone pastes this address into
         a chat, a bulletin, or a post. It is the app's first sentence, so it says
         what Plumbline IS rather than what it has.

         ABSOLUTE urls on purpose. Everything else here is relative — `base: "./"`
         keeps the bundle host-agnostic — but a crawler is not a browser: it reads
         the markup, resolves nothing, and drops a card whose image it cannot
         fetch. So these name the one origin the app is shared from. (The old Pages
         address 301s there, and a 301 is followed.)

         og:image states its exact pixel size because scrapers that would have to
         download and measure the file often skip the image instead — which means
         the numbers below and the shipped PNG can disagree with nothing on screen
         to show it. `e2e/social.spec.ts` decodes the file and holds them equal. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Plumbline" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://plumblinebible.org/" />
    <meta property="og:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      property="og:description"
      content="The Holy Bible in a free, private, offline application."
    />
    <meta property="og:image" content="https://plumblinebible.org/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Plumbline icon, a cross."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Plumbline — the Holy Bible, free and offline" />
    <meta
      name="twitter:description"
      content="The Holy Bible in a free, private, offline application."
    />
    <meta name="twitter:image" content="https://plumblinebible.org/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="The Plumbline icon, a cross."
    />

    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- iOS ignores the webmanifest icons when someone adds this to their home
         screen, and it composites a transparent icon on BLACK, so this one is
         opaque and bleeds to all four edges — iOS rounds the corners itself.
         Without it the home screen shows a screenshot of the page. -->
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./fonts.css" />

    <!-- THE PAGE'S COLOURS BEFORE ANY OF THE APP EXISTS.
         `session.applyTheme()` has always written the resolved palette to
         localStorage "so the boot snapshot can paint before the engine exists" —
         and nothing has read it since the boot snapshot was removed. So every
         launch painted cream paper and then repainted in the reader's real
         theme once the engine answered: a dark-theme reader got a full-screen
         cream flash on EVERY launch, warm boots included (audit D-11).

         Two layers, cheapest first:
           1. these defaults, so a first-ever visit (nothing stored yet) still
              opens in the scheme the device asked for — the same bet the
              noscript block below makes, and the same one `ThemeChoice::System`
              makes once the engine is up;
           2. the inline script, which overrides them with last session's ACTUAL
              resolved palette (a reader on Night, or on a theme that disagrees
              with the OS, is not served by a media query).
         Both are then overwritten by `applyTheme()` the moment the engine
         answers, so neither can be wrong for longer than the splash.

         Only the roles the splash and the bare page paint: paper, ink, faded,
         gold, rule, and tierResearch (the app's one alarm colour, which the boot
         error is written in — and a boot error is exactly the case where nothing
         has been stored yet). Values are Theme::Light / Theme::Dark from
         crates/core/src/theme.rs, and `e2e/splash.spec.ts` re-derives every one
         of them from that file rather than trusting this comment. -->
    <style>
      :root {
        /* The controls the BROWSER draws, not us — the time input's clock glyph,
           its spinner, the scrollbars, the native picker popups. Unset, a UA
           assumes light and paints them near-black on a dark theme's surfaces.
           `session.applyTheme()` overwrites this with the reader's resolved
           palette; the media pair here is only what holds until it runs. It was
           previously declared ONLY inside the noscript below, where a scripting
           browser never parses it. */
        color-scheme: light;
        --paper: #fcf9f4;
        --ink: #211f1a;
        --faded: #6c665d;
        --gold: #7d632c;
        --rule: #d8cba8;
        --tierResearch: #aa4838;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          --paper: #1f1b16;
          --ink: #f5f1e8;
          --faded: #9a9385;
          --gold: #c8a24e;
          --rule: #4a4234;
          --tierResearch: #d17261;
        }
      }
    </style>
    <!-- A classic, blocking, inline script ON PURPOSE: the whole value of this
         is that it runs before the first paint, and a module script (or one in
         the bundle) is deferred until after the document has been laid out —
         which is exactly the flash it exists to remove. It is also why it stays
         here and not in App.svelte: Svelte mounts long after the browser has
         already shown the reader a page. -->
    <script>
      try {
        var stored = JSON.parse(localStorage.getItem("plumbline:palette") || "null");
        // Every string role, not a hand-picked five: the writer is
        // `applyTheme()`, which sets one custom property per string field, and
        // reproducing its subset here would be a second list to keep in step.
        if (stored) {
          for (var role in stored)
            if (typeof stored[role] === "string")
              document.documentElement.style.setProperty("--" + role, stored[role]);
          // The status bar too, and BOTH tags (see session.applyTheme) — but
          // ONLY for a theme the reader chose by hand. For "follow the device"
          // the media-scoped pair above is already the right pre-script answer
          // and last session's paper may not be (the phone's scheme can change
          // between sessions); for an explicit theme the cached paper is right
          // whatever the device says, and the pair is what is stale — a
          // dark-mode phone under a light reader theme otherwise boots with
          // light icons over cream until the engine's palette lands.
          var choice = localStorage.getItem("plumbline:themeChoice");
          if (typeof stored.paper === "string" && choice && choice !== "system") {
            var metas = document.querySelectorAll('meta[name="theme-color"]');
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", stored.paper);
            // The UA-drawn controls, on the same terms and for the same reason:
            // the media pair in the stylesheet above answers for "follow the
            // device", and last session's flag answers for a theme chosen by
            // hand (a reader on Night with the phone in light mode is not
            // served by the query).
            document.documentElement.style.colorScheme = stored.dark ? "dark" : "light";
          }
        }
      } catch (e) {
        /* storage blocked or unparseable: the defaults above still paint */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!-- What a browser with JavaScript switched off gets, and what a text-only
         crawler reads. Both used to get blank cream paper for ever, which reads
         as a broken site rather than an unmet requirement. There is nothing to
         degrade to: the text, the concordance and the reader's own notes are all
         built in the page from a local engine, with no server rendering anything.

         The styles live INSIDE the noscript on purpose. A browser with scripting
         ENABLED never parses the contents of a noscript element — they are raw
         text to it — so nothing in here can reach the running app: not the CSS,
         not the markup, not the accessibility tree, not Ctrl+F. And it cannot
         lean on the bundle's stylesheet either, because the premise is that the
         bundle never ran. Same palette values as the light/dark themes. -->
    <noscript>
      <style>
        #app {
          display: none;
        }
        :root {
          color-scheme: light dark;
          --ns-paper: #fcf9f4;
          --ns-ink: #211f1a;
          --ns-faded: #6c665d;
          --ns-gold: #7d632c;
        }
        @media (prefers-color-scheme: dark) {
          :root {
            --ns-paper: #1f1b16;
            --ns-ink: #f5f1e8;
            --ns-faded: #9a9385;
            --ns-gold: #c8a24e;
          }
        }
        body {
          margin: 0;
          background: var(--ns-paper);
          color: var(--ns-ink);
          font-family: "EB Garamond", Georgia, "Times New Roman", serif;
          line-height: 1.6;
        }
        .noscript-page {
          box-sizing: border-box;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 2rem 1.5rem;
        }
        .noscript-card {
          max-width: 30rem;
        }
        .noscript-card h1 {
          margin: 0 0 0.15rem;
          font-size: 2rem;
          font-weight: 600;
          letter-spacing: 0.02em;
        }
        .noscript-card p {
          margin: 0.9rem 0 0;
        }
        .noscript-card .tagline {
          margin: 0;
          color: var(--ns-faded);
          font-size: 1.1rem;
        }
        .noscript-card .aside {
          margin-top: 1.4rem;
          color: var(--ns-faded);
          font-size: 0.95rem;
        }
        .noscript-card a {
          color: var(--ns-gold);
        }
      </style>
      <div class="noscript-page">
        <div class="noscript-card">
          <h1>Plumbline</h1>
          <p class="tagline">
            The Holy Bible, free and offline — the whole 1769 King James Version, on your own
            device.
          </p>
          <p>
            Plumbline needs JavaScript. The text, the concordance and your own notes all run here
            on your device rather than on a server, so there is no plain page to fall back to.
            Switch JavaScript on for this site and reload: the Bible downloads once, and after that
            it opens with the network off.
          </p>
          <p class="aside">
            If you would rather not run it, there is an Android app on the
            <a href="https://github.com/glendonjklassen/plumbline/releases">Releases page</a>.
          </p>
        </div>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
