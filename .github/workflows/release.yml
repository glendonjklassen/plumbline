name: Release

# Tag a version (v0.2.0) and this runs the CI workflow on that commit, and only
# once every job of it is green creates a GitHub Release (the changelog) and
# deploys the PWA (apps/web) to plumblinebible.org, the Hetzner server in
# ops/hetzner/, keeping GitHub Pages up to date as a standby.
#
# The version a reader SEES is derived once, in the `version` job below. The tag
# keeps its `v` (it is a git name); About does not. Computed per job, consumers
# disagreed about the same release.

on:
  push:
    tags: ["v*"]
  # A manual run is a DRY RUN: it does everything a tag does — the version gate,
  # the data pack contract, the type check, the wasm engine, the Pages bundle —
  # and publishes nothing. Every publishing step carries the same guard,
  # `github.event_name != 'workflow_dispatch'`. No inputs on purpose, so a manual
  # run cannot be pointed at a version and talked into overwriting one.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ONE release, ONE version number. Every consumer of a displayed version reads
  # this job's outputs, so two consumers cannot label the same release
  # differently again:
  #   name = the tag without its leading 'v' (1.0.0) — the web's
  #          PLUMBLINE_VERSION, rendered bare under About next to
  #          `engine <CARGO_PKG_VERSION>`, which is bare too.
  #   code = major*10000 + minor*100 + patch (0.3.1 -> 301), monotonic across
  #          semver. Kept even with no APK consuming it: it is one line, and
  #          any future installable artifact needs exactly this number.
  # It also refuses a tag whose version disagrees with the manifests, because
  # About reads the engine version from Cargo.toml, not from the tag: v1.1.0 off
  # an unbumped tree ships "Plumbline 1.1.0 · engine 1.0.0". Everything else
  # needs this job on purpose — a pre-flight gate is not the artifact coupling
  # v0.3.0 taught us to avoid; artifacts labelled with the wrong version are
  # worse than a release that stops and says why.
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - name: Derive the displayed version, and check the manifests agree
        id: v
        run: |
          crate=$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)
          web=$(grep -m1 -E '^  "version": "' apps/web/package.json | cut -d'"' -f4)
          # A dry run has no tag. It labels itself from Cargo.toml — the number a
          # tag would have to match anyway — so the build is stamped like the real
          # thing while the manifests are still checked against each other. Nothing
          # publishes on this path, so the string only ever reaches a build.
          tag="${{ github.ref_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v$crate"
          fi
          name="${tag#v}"
          core="${name%%-*}"
          IFS=. read -r maj min pat <<< "$core"
          if [ "$core" != "$crate" ] || [ "$core" != "$web" ]; then
            echo "::error::Tag $tag means version $core, but Cargo.toml says '$crate' and apps/web/package.json says '$web'. Bump both manifests (About shows the Cargo version as the engine version), commit, and move the tag."
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${maj:-0} * 10000 + ${min:-0} * 100 + ${pat:-0} ))" >> "$GITHUB_OUTPUT"

  # THE GATE. ci.yml as a called workflow: every job it has, on this commit,
  # inside this run — so "the release is green" and "CI is green" are one fact.
  # Until 2026-09-23 the two workflows fired on the tag side by side, and
  # v0.74.0 went to plumblinebible.org with a red `web` job beside it. A flake
  # here holds the publish; re-run the failed job and the release resumes.
  ci:
    uses: ./.github/workflows/ci.yml

  # The GitHub Release, only once the suite is green — the changelog should never
  # describe a build that did not ship. (v0.3.0's lesson, one platform's break
  # blocking every other artifact, no longer applies: the PWA is the one artifact.)
  create-release:
    runs-on: ubuntu-24.04
    needs: [version, ci]
    steps:
      # Guarded on the step, not the job: a skipped job skips everything that
      # needs it, and a dry run is supposed to keep building.
      - name: Create the release if it does not exist yet
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "$GITHUB_REPOSITORY" \
                 --title "Plumbline ${{ github.ref_name }}" --generate-notes

  # Deploy the PWA. Same pipeline the `ci` job above has just verified on this
  # commit: data pack → wasm engine → Vite bundle; the bundle is base "./" so
  # any path serves it without a rebuild.
  #
  # plumblinebible.org is the Hetzner server in Helsinki (ops/hetzner/), since
  # 2026-10; DNS points there, not at GitHub. Pages was the host from
  # 2026-07-25 and is still deployed after the server, as a standby a DNS
  # change could bring back, but it cannot hold up or fail a release.
  site:
    runs-on: ubuntu-24.04
    # create-release: the SHA256SUMS below is attached to that release.
    needs: [version, ci, create-release]
    # Job-level so the steps' `if` can see it: a fork, or a checkout without the
    # secrets, skips the server and its check. The MIRROR_ names date from when
    # the server was a mirror; renaming them means re-entering them in Settings.
    env:
      MIRROR_HOST: ${{ secrets.MIRROR_HOST }}
    permissions:
      contents: write # attach SHA256SUMS to the release
      pages: write
      id-token: write
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: https://plumblinebible.org/
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install web dependencies
        run: npm ci
        working-directory: apps/web

      - name: Build the data pack
        run: node scripts/build-web-pack.mjs

      # The pack is generated fresh in THIS job and then deployed to readers, so
      # this is the last place it can be checked and the only place it really
      # matters. CI validates the same thing on every push, but a release can be
      # tagged from any commit — and a pack that violates the loader's contract
      # surfaces as a boot that hangs with no diagnostic, on everyone's device at
      # once. Entry shape, closed stage set, and every hash re-derived from the
      # bytes about to ship.
      - name: Check the data pack against the loader's contract
        run: node scripts/check-web-pack.mjs

      - name: Build the engine (wasm32-wasip1)
        run: cargo build --locked -p plumbline-ffi --release --target wasm32-wasip1

      # `npm run check` for the same reason the pack check is here: CI runs
      # svelte-check on every push, but a tag can be cut from any commit, and
      # this job goes straight to plumblinebible.org. It runs before the bundle
      # so a type error stops the release instead of shipping in it.
      - name: Build the app
        run: |
          node scripts/copy-wasm.mjs
          npm run check
          npm run build
        working-directory: apps/web
        env:
          # Stamped into About, so a bug report can name its build. Without it
          # a deployed PWA cannot tell you which release it is (2026-07-27).
          # The same string the APK carries — bare, no leading 'v'.
          PLUMBLINE_VERSION: ${{ needs.version.outputs.name }}

      # The record of what this release serves, byte for byte, kept on GitHub
      # where a compromised server cannot rewrite it. check-site.sh compares the
      # live site against it after the upload and every day after (site-check.yml).
      # Written on a dry run too, so the step itself is exercised.
      - name: Checksum every file in the build
        run: |
          cd apps/web/dist
          find . -type f ! -name CNAME -printf '%P\n' | LC_ALL=C sort | xargs sha256sum > "$RUNNER_TEMP/SHA256SUMS"
          wc -l < "$RUNNER_TEMP/SHA256SUMS"

      # Everything above builds and checks; everything below publishes. A dry run
      # stops here — it has proved the bundle can be built, which is the whole
      # question a manual run is asking.
      #
      # The checksums go up BEFORE the files, so the daily check can never
      # compare a new site against the previous release's record.
      - name: Attach the checksums to the release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$RUNNER_TEMP/SHA256SUMS" --clobber --repo "$GITHUB_REPOSITORY"
      #
      # The pack is content-addressed, so a release that changed one file uploads
      # one file; --delay-updates keeps the swap close to atomic; CNAME is
      # GitHub's alone. The host key is PINNED (MIRROR_KNOWN_HOSTS), not accepted
      # on first use: a deploy key that will talk to whoever answers the IP is no
      # deploy key.
      - name: Upload the site to plumblinebible.org
        if: github.event_name != 'workflow_dispatch' && env.MIRROR_HOST != ''
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/mirror ~/.ssh/known_hosts
          rsync -az --delete --delay-updates --exclude CNAME \
            -e "ssh -i ~/.ssh/mirror -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            apps/web/dist/ "deploy@${MIRROR_HOST}:/srv/plumbline/"

      # Proves the upload landed rather than assuming it: DNS points at the box,
      # every served file matches the checksums just attached, and the
      # certificate is renewing. The same script runs daily (site-check.yml)
      # for what changes between releases.
      - name: Check plumblinebible.org is serving this release
        if: github.event_name != 'workflow_dispatch' && env.MIRROR_HOST != ''
        run: ops/hetzner/check-site.sh https://plumblinebible.org "$RUNNER_TEMP/SHA256SUMS"

      # The standby. continue-on-error, so GitHub can neither block nor fail a
      # release that has already reached readers; a failure still shows as a
      # warning on the run.
      - uses: actions/configure-pages@v5
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        with:
          path: apps/web/dist

      - name: Deploy the standby to GitHub Pages
        if: github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/deploy-pages@v4
