# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX is required by every dependency we use.
android.useAndroidX=true

# Kotlin official code style.
kotlin.code.style=official

# Only build the resources for the ABIs we actually ship (see app abiFilters).
android.enableResourceOptimizations=true

# Parallel + caching for faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true

# Keep non-transitive R classes (smaller, faster).
android.nonTransitiveRClass=true
