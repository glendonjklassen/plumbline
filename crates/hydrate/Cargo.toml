[package]
name = "plumbline-hydrate"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Assemble + verify the Plumbline data pack (core reader + R&D artifacts) into a home."

[[bin]]
name = "plumbline-hydrate"
path = "src/main.rs"

[dependencies]
plumbline-core = { workspace = true }
plumbline-rnd = { workspace = true, features = ["bridge", "embeddings", "morphology"] }
